services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antrian
      POSTGRES_USER: antrian
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      TZ: Asia/Jakarta
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antrian -d antrian"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]   # hanya lokal; akses publik lewat reverse proxy
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://antrian:${DB_PASSWORD}@db:5432/antrian
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env}
      NAMA_INSTANSI: ${NAMA_INSTANSI:-PST BPS Provinsi Kepulauan Riau}
      JUMLAH_MEJA: ${JUMLAH_MEJA:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata: {}
