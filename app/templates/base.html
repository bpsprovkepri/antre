<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antrian – {{ nama }}</title>
<style>
:root{--g:#1a8f4a;--mut:#6b7280}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f5f6fb;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;padding:18px;margin-bottom:16px;display:block;color:inherit;text-decoration:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.big{font-size:2rem;color:var(--g);margin:0}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border:1px solid #e5e7eb;text-align:center}th{background:#fafafa}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{background:#d1d5db;cursor:not-allowed}.sec{background:var(--mut)}
@media print{button,.noprint{display:none!important}}
</style></head><body><div class="wrap">{% block body %}{% endblock %}</div>{% block script %}{% endblock %}</body></html>
