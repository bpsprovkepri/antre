# Compose khusus Coolify. Skema: Nginx eksternal (aaPanel) -> port host -> kontainer app -> PostgreSQL milik sendiri.
# Port host dipublikasikan langsung (melewati proxy Coolify), jadi JANGAN isi Domains di Coolify.
# Semua nilai diisi lewat Environment Variables di Coolify (jangan ditulis di file ini).
services:
  app:
    build: .
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8097}:8000"
    environment:
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-db-antre}
      DB_USER: ${DB_USER:?}
      DB_PASS: ${DB_PASS:?}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      NAMA_INSTANSI: ${NAMA_INSTANSI:-PST BPS Provinsi Kepulauan Riau}
      JUMLAH_MEJA: ${JUMLAH_MEJA:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}   # 1 = login hanya lewat HTTPS; set 0 jika perlu uji lewat http
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
