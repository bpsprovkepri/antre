# Compose khusus Coolify, untuk skema: Nginx eksternal (aaPanel) -> port host -> kontainer app.
# Port host dipublikasikan langsung (melewati proxy Coolify), jadi JANGAN isi Domains di Coolify.
# Atur lewat Environment Variables di Coolify:
#   APP_BIND = IP yang di-listen di server (disarankan IP Tailscale server ini; default 0.0.0.0)
#   APP_PORT = port host untuk proxy_pass Nginx (default 8097)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antrian
      POSTGRES_USER: antrian
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}   # dibuat otomatis oleh Coolify
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antrian -d antrian"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8097}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://antrian:${SERVICE_PASSWORD_POSTGRES}@db:5432/antrian
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}               # WAJIB diisi di tab Environment Variables
      NAMA_INSTANSI: ${NAMA_INSTANSI:-PST BPS Provinsi Kepulauan Riau}
      JUMLAH_MEJA: ${JUMLAH_MEJA:-3}
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
